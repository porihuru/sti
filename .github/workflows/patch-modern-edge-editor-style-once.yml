name: Patch modern Edge editor style once

on:
  push:
    paths:
      - '.github/modern-edge-editor-style-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add compact editor CSS and modern save messages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          style_path = Path('css/style.css')
          ie_path = Path('css/ie11.css')
          app_path = Path('js/app.js')

          style = style_path.read_text(encoding='utf-8')
          ie = ie_path.read_text(encoding='utf-8')
          app = app_path.read_text(encoding='utf-8')

          marker = '/* Compact CSV editor layout for IE mode. */'
          modern_marker = '/* Compact CSV editor layout for modern browsers. */'
          if modern_marker not in style:
              start = ie.find(marker)
              if start < 0:
                  raise SystemExit('compact IE editor CSS not found')
              compact = ie[start:]
              compact = compact.replace(marker, modern_marker, 1)
              compact = compact.replace(
                  '@media all and (-ms-high-contrast: none), (-ms-high-contrast: active) {',
                  '@media screen {',
                  1
              )
              compact = compact.replace(
                  '@media all and (-ms-high-contrast: none) and (max-width: 960px),\n       (-ms-high-contrast: active) and (max-width: 960px) {',
                  '@media (max-width: 960px) {',
                  1
              )
              compact = compact.replace(
                  '@media all and (-ms-high-contrast: none) and (max-width: 720px),\n       (-ms-high-contrast: active) and (max-width: 720px) {',
                  '@media (max-width: 720px) {',
                  1
              )
              compact += '''\n\n/* Modern browsers need the editor column layout explicitly. */\n.editor-layout-compact {\n  display: flex;\n  align-items: flex-start;\n}\n.record-editor-compact {\n  flex: 1 1 auto;\n  min-width: 0;\n}\n@media (max-width: 960px) {\n  .editor-layout-compact { display: block; }\n}\n'''
              style = style.rstrip() + '\n\n' + compact.lstrip()
              style_path.write_text(style, encoding='utf-8')

          app = app.replace(
              'setMessage("Windowsの保存画面を開いています…");',
              'setMessage("CSVへ保存しています…");',
              1
          )
          app = app.replace(
              'setMessage("保存画面で元のR8db.csvを指定し、上書きしてください。変更内容は画面内にも残しています。");',
              'setMessage("変更内容をローカルCSVへ保存しました。");',
              1
          )
          app_path.write_text(app, encoding='utf-8')
          PY

          node --check js/app.js
          grep -q 'Compact CSV editor layout for modern browsers' css/style.css
          grep -q 'editor-layout-compact' css/style.css
          grep -q '変更内容をローカルCSVへ保存しました。' js/app.js

      - name: Commit final source changes only
        shell: bash
        run: |
          rm -f .github/workflows/patch-modern-edge-editor-style-once.yml
          rm -f .github/modern-edge-editor-style-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m '通常EdgeのCSV編集表示を最終版に統一'
          git push origin HEAD:main
