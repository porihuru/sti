name: Fix CSV save state once

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.issue.title == 'RUN CSV SAVE STATE FIX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app.js and clean temporary files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text(encoding='utf-8')
          old = '''      }).then(function () {
        byId("saveAllCsvButton").textContent = "CSVを再保存";
        setMessage("変更内容をローカルCSVへ保存しました。");
      }).catch(function () {
'''
          new = '''      }).then(function () {
        var savedCurrentId = batch.currentId;
        batch.rows = cloneRows(rows);
        indexOriginalRows(rows);
        batch.status = {};
        batch.previousStatus = {};
        batch.isNew = false;
        batch.dirty = false;
        if (!findRow(savedCurrentId)) { savedCurrentId = rows.length ? rows[0].id : null; }
        batch.currentId = savedCurrentId;
        byId("saveAllCsvButton").textContent = "CSVを保存";
        updateChangeSummary();
        if (savedCurrentId !== null) { openRecord(savedCurrentId); }
        else { renderList(); }
        setMessage("変更内容をローカルCSVへ保存しました。");
      }).catch(function () {
'''
          if s.count(old) != 1:
              raise SystemExit('CSV save target not found exactly once')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git rm -f .github/workflows/fix-csv-save-state-once.yml .github/fix-csv-save-state.trigger
          git commit -m "CSV保存後の編集状態をリセット"
          git push origin main
