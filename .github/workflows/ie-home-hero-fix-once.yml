name: IE home hero fix once

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.title == 'RUN_IE_HOME_HERO_FIX_ONCE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch IE home hero layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('css/ie11.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* Stable home hero layout for IE mode. */'
          block = r'''

/* Stable home hero layout for IE mode. */
@media all and (-ms-high-contrast: none), (-ms-high-contrast: active) {
  .hero-panel {
    display: -ms-flexbox;
    display: flex;
    -ms-flex-align: center;
    align-items: center;
    -ms-flex-pack: justify;
    justify-content: space-between;
    min-height: 0;
    background: #18312d;
  }
  .hero-copy {
    display: block;
    width: 58%;
    max-width: none;
    -ms-flex: 1 1 58%;
    flex: 1 1 58%;
    min-width: 0;
    padding-right: 24px;
    color: #ffffff;
  }
  .hero-copy h1 { color: #ffffff; }
  .hero-copy h1 span { color: #f1c469; }
  .hero-panel .eyebrow { color: #7dd7cb; }
  .hero-description { color: #dce6e2; }
  .today-card {
    display: block;
    width: 38%;
    max-width: 420px;
    height: auto;
    min-height: 0;
    -ms-flex: 0 0 38%;
    flex: 0 0 38%;
    -ms-flex-item-align: center;
    align-self: center;
    background: #f7f1df;
  }
}

@media all and (-ms-high-contrast: none) and (max-width: 720px),
       (-ms-high-contrast: active) and (max-width: 720px) {
  .hero-panel { display: block; }
  .hero-copy,
  .today-card {
    width: auto;
    max-width: none;
  }
  .hero-copy {
    padding-right: 0;
    margin-bottom: 16px;
  }
  .today-card { margin: 0; }
}
'''
          if marker not in s:
              s += block
              p.write_text(s, encoding='utf-8')
      - name: Clean and commit
        run: |
          rm -f .github/workflows/ie-home-hero-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/ie11.css .github/workflows/ie-home-hero-fix-once.yml
          git commit -m "IEモードのホーム上部レイアウト崩れを修正"
          git push origin main
