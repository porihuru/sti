name: Result detail PR once

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.title == 'RUN_RESULT_DETAIL_PR_ONCE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app.js
        run: python .github/result-detail-patch.py
      - name: Clean temporary files and commit
        run: |
          rm -f .github/result-detail.trigger
          rm -f .github/result-detail-patch.py
          rm -f .github/workflows/result-detail-once.yml
          rm -f .github/workflows/result-detail-pr-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github
          git commit -m "回答結果を出題順と選択内容が分かる表示に改善"
          git push origin main
