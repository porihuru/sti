name: Continuous CSV add once

on:
  push:
    branches: [main]
    paths:
      - '.github/continuous-csv-add.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch continuous add behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [Path('js/app.js'), Path('js/ie11.js')]

          old_var = '''      var currentStatus;\n      var i;\n      if (!form.checkValidity()) {'''
          new_var = '''      var currentStatus;\n      var i;\n      var wasNew = batch.isNew;\n      if (!form.checkValidity()) {'''

          old_tail = '''      batch.nickname = row.notes2;\n      batch.currentId = row.id;\n      batch.isNew = false;\n      setDirty(false);\n      openRecord(row.id);\n      setMessage("ID " + row.id + "の変更を確定しました。最後に「CSVを保存」を押してください。");\n      return true;\n    }\n\n    function startAdd() {\n      var maxId = 0;\n      var i;\n      for (i = 0; i < batch.rows.length; i += 1) {\n        if (batch.rows[i].id > maxId) { maxId = batch.rows[i].id; }\n      }\n      batch.previousId = batch.currentId;\n      batch.currentId = null;\n      batch.isNew = true;\n      byId("editorSearch").value = "";\n      fillForm({ id: maxId + 1, importance: 1, difficulty: "初級", notes2: batch.nickname }, true);\n    }'''

          new_tail = '''      batch.nickname = row.notes2;\n      if (wasNew) {\n        batch.currentId = row.id;\n        batch.isNew = false;\n        setDirty(false);\n        startAdd(row);\n        setMessage("ID " + row.id + "の追加を確定しました。続けて次のレコードを入力できます。最後に「CSVを保存」を押してください。");\n        return true;\n      }\n      batch.currentId = row.id;\n      batch.isNew = false;\n      setDirty(false);\n      openRecord(row.id);\n      setMessage("ID " + row.id + "の変更を確定しました。最後に「CSVを保存」を押してください。");\n      return true;\n    }\n\n    function startAdd(sourceRow) {\n      var maxId = 0;\n      var source = sourceRow || findRow(batch.currentId);\n      var template;\n      var i;\n      for (i = 0; i < batch.rows.length; i += 1) {\n        if (batch.rows[i].id > maxId) { maxId = batch.rows[i].id; }\n      }\n      batch.previousId = source ? source.id : batch.currentId;\n      batch.currentId = null;\n      batch.isNew = true;\n      byId("editorSearch").value = "";\n      template = {\n        id: maxId + 1,\n        importance: source ? source.importance : 1,\n        difficulty: source ? source.difficulty : "初級",\n        category1: source ? (source.category1 || source.category || "") : "",\n        category2: source ? (source.category2 || "") : "",\n        notes2: source && source.notes2 && source.notes2 !== "-" ? source.notes2 : batch.nickname,\n        notes3: source ? (source.notes3 || "") : "",\n        notes4: source ? (source.notes4 || "") : "",\n        notes5: source ? (source.notes5 || "") : ""\n      };\n      fillForm(template, true);\n      setDirty(false);\n      renderList();\n      byId("editOriginal").focus();\n    }'''

          for p in paths:
              s = p.read_text(encoding='utf-8')
              if s.count(old_var) != 1:
                  raise SystemExit(f'{p}: commitCurrent var target count={s.count(old_var)}')
              if s.count(old_tail) != 1:
                  raise SystemExit(f'{p}: commit/startAdd target count={s.count(old_tail)}')
              s = s.replace(old_var, new_var, 1)
              s = s.replace(old_tail, new_tail, 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/ie11.js
          git rm .github/workflows/continuous-csv-add-once.yml .github/continuous-csv-add.trigger
          git commit -m "CSV新規追加を連続入力しやすく改善"
          git push origin HEAD:main
