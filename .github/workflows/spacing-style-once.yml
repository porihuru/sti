name: Spacing style tune once

on:
  push:
    branches: [main]
    paths:
      - '.github/spacing-style.trigger'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add spacing overrides
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/style.css')
          text = p.read_text(encoding='utf-8')
          marker = '/* Comfortable spacing tune */'
          block = r'''

/* Comfortable spacing tune */
main {
  width: min(1120px, calc(100% - 72px));
}

.view {
  padding-top: 64px;
  padding-bottom: 88px;
}

#homeView {
  padding-top: 18px;
  padding-bottom: 28px;
}

.hero-panel {
  padding: 18px 28px 22px;
  gap: 28px;
}

.today-card {
  padding: 16px 18px;
}

.section-heading {
  margin-top: 22px;
  margin-bottom: 14px;
}

.page-heading {
  margin-bottom: 24px;
}

.mode-grid {
  gap: 16px;
}

.mode-card {
  padding: 16px 16px 14px;
}

.settings-card,
.start-card,
.question-card,
.feedback-panel,
.analysis-card,
.result-summary,
.report-conditions,
.result-details,
.editor-file-card,
.editor-toolbar,
.editor-records,
.record-editor {
  padding: 18px;
}

.form-section {
  padding-top: 18px;
  padding-bottom: 22px;
}

.form-grid {
  gap: 16px;
}

.analysis-grid {
  gap: 18px;
}

.analysis-card {
  padding: 20px;
}

.result-summary {
  gap: 12px;
}

.editor-layout {
  gap: 16px;
}

.editor-records {
  padding: 14px;
}

.record-editor {
  padding: 16px 18px;
}

.record-editor-heading,
.record-editor-heading-compact {
  margin-bottom: 12px;
  padding-bottom: 10px;
}

.editor-fields > .field,
.long-editor-fields-compact > .field {
  margin-bottom: 14px;
}

.editor-fields textarea,
.long-editor-fields-compact textarea {
  min-height: 96px;
}

.record-navigation {
  margin-top: 10px;
}

.record-editor-actions,
.record-editor-actions-compact {
  margin-top: 12px;
  padding-top: 12px;
}

@media (max-width: 960px) {
  main {
    width: min(1120px, calc(100% - 48px));
  }
}

@media (max-width: 720px) {
  main {
    width: calc(100% - 32px);
  }

  .view {
    padding-top: 36px;
    padding-bottom: 54px;
  }
}
'''
          if marker not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += block.lstrip('\n')
              p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/spacing-style-once.yml .github/spacing-style.trigger
          git add css/style.css
          git commit -m "画面全体の余白を調整"
          git push origin HEAD:main
