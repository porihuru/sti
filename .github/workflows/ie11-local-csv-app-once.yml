name: Add IE11 local CSV editor fallback once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ie11-local-csv-app-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app.js for IE11 local CSV editing
        shell: python
        run: |
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text(encoding='utf-8')

          old_validation = '''    if (!form.checkValidity()) {
              form.reportValidity();
              byId("recordEditorMessage").textContent = "必須項目を入力してください。";
              return;
            }'''
          new_validation = '''    if (!form.checkValidity()) {
              if (form.reportValidity) { form.reportValidity(); }
              byId("recordEditorMessage").textContent = "必須項目を入力してください。";
              return;
            }'''

          old_overwrite = '''  function overwriteLocalCsv(text, filename, onSuccess, onError) {
            if (!state.editor.fileHandle) {
              onError(new Error("書き込み可能なCSVが開かれていません。"));
              return;
            }
            requestReadWritePermission(state.editor.fileHandle, function () {
              writeCsvToHandle(state.editor.fileHandle, text, filename, onSuccess, onError);
            }, onError);
          }'''
          new_overwrite = '''  function legacyFileEditingAvailable() {
            return !!(window.FileReader && window.Blob && window.navigator && window.navigator.msSaveBlob);
          }

          function saveCsvWithLegacyDialog(text, filename, onSuccess, onError) {
            var blob;
            var started;
            try {
              blob = new Blob([text], { type: "text/csv;charset=utf-8" });
              started = window.navigator.msSaveBlob(blob, filename || "R8db.csv");
              if (started === false) {
                onError(new Error("CSV保存を開始できませんでした。"));
                return;
              }
              onSuccess(filename);
            } catch (error) {
              onError(error);
            }
          }

          function overwriteLocalCsv(text, filename, onSuccess, onError) {
            if (state.editor.fileHandle) {
              requestReadWritePermission(state.editor.fileHandle, function () {
                writeCsvToHandle(state.editor.fileHandle, text, filename, onSuccess, onError);
              }, onError);
              return;
            }
            if (legacyFileEditingAvailable()) {
              saveCsvWithLegacyDialog(text, filename, onSuccess, onError);
              return;
            }
            onError(new Error("CSVを保存できる環境ではありません。"));
          }'''

          old_picker = '''  function directFileEditingAvailable() {
            return !!(window.isSecureContext && window.showOpenFilePicker);
          }

          function openLocalCsvPicker() {
            var options;
            if (!directFileEditingAvailable()) {
              byId("editorMessage").textContent = "この環境ではCSVを直接更新できません。Windows版Edge 95以上で、localhostまたはHTTPSから開いてください。";
              return;
            }
            options = {
              multiple: false,
              types: [{ description: "R8db CSV", accept: { "text/csv": [".csv"] } }],
              excludeAcceptAllOption: true
            };
            window.showOpenFilePicker(options).then(function (handles) {
              var handle = handles && handles[0];
              if (!handle) { return; }
              requestReadWritePermission(handle, function () {
                handle.getFile().then(function (file) { loadLocalCsvFile(file, handle); }).catch(function () {
                  byId("editorMessage").textContent = "CSVファイルを読み取れませんでした。";
                });
              }, function () {
                byId("editorMessage").textContent = "CSVへの読み書きが許可されませんでした。ファイルは読み込まれませんでした。";
              });
            }).catch(function (error) {
              if (!error || error.name !== "AbortError") {
                byId("editorMessage").textContent = "CSVファイルを開けませんでした。";
              }
            });
          }

          function updateEditorCapability() {
            var available = directFileEditingAvailable();
            byId("openLocalCsvButton").disabled = !available;
            if (!available) {
              byId("editorMessage").textContent = "CSV直接編集はWindows版Edge 95以上のlocalhostまたはHTTPS環境で利用できます。";
            }
          }'''
          new_picker = '''  function directFileEditingAvailable() {
            return !!(window.isSecureContext && window.showOpenFilePicker);
          }

          function editorFileEditingAvailable() {
            return directFileEditingAvailable() || legacyFileEditingAvailable();
          }

          function openLegacyCsvPicker() {
            var previous = byId("legacyCsvFileInput");
            var input;
            if (previous && previous.parentNode) { previous.parentNode.removeChild(previous); }
            input = document.createElement("input");
            input.id = "legacyCsvFileInput";
            input.type = "file";
            input.accept = ".csv,text/csv";
            input.style.position = "absolute";
            input.style.left = "-9999px";
            input.style.width = "1px";
            input.style.height = "1px";
            input.onchange = function () {
              var file = input.files && input.files[0];
              if (input.parentNode) { input.parentNode.removeChild(input); }
              if (file) { loadLocalCsvFile(file, null); }
            };
            document.body.appendChild(input);
            input.click();
          }

          function openLocalCsvPicker() {
            var options;
            if (directFileEditingAvailable()) {
              options = {
                multiple: false,
                types: [{ description: "R8db CSV", accept: { "text/csv": [".csv"] } }],
                excludeAcceptAllOption: true
              };
              window.showOpenFilePicker(options).then(function (handles) {
                var handle = handles && handles[0];
                if (!handle) { return; }
                requestReadWritePermission(handle, function () {
                  handle.getFile().then(function (file) { loadLocalCsvFile(file, handle); }).catch(function () {
                    byId("editorMessage").textContent = "CSVファイルを読み取れませんでした。";
                  });
                }, function () {
                  byId("editorMessage").textContent = "CSVへの読み書きが許可されませんでした。ファイルは読み込まれませんでした。";
                });
              }).catch(function (error) {
                if (!error || error.name !== "AbortError") {
                  byId("editorMessage").textContent = "CSVファイルを開けませんでした。";
                }
              });
              return;
            }
            if (legacyFileEditingAvailable()) {
              openLegacyCsvPicker();
              return;
            }
            byId("editorMessage").textContent = "この環境ではローカルCSVを編集できません。";
          }

          function updateEditorCapability() {
            var available = editorFileEditingAvailable();
            byId("openLocalCsvButton").disabled = !available;
            if (legacyFileEditingAvailable() && !directFileEditingAvailable()) {
              byId("editorMessage").textContent = "IEモードではローカルCSVを開いて編集できます。保存時はWindowsの保存画面で元のR8db.csvを指定して上書きしてください。";
            } else if (!available) {
              byId("editorMessage").textContent = "この環境ではローカルCSVを編集できません。";
            }
          }'''

          replacements = [
              (old_validation, new_validation, 'reportValidity guard'),
              (old_overwrite, new_overwrite, 'legacy save fallback'),
              (old_picker, new_picker, 'legacy file picker'),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')

          checks = [
              'function legacyFileEditingAvailable()',
              'window.navigator.msSaveBlob',
              'function openLegacyCsvPicker()',
              'input.type = "file"',
              'if (form.reportValidity) { form.reportValidity(); }',
              'return directFileEditingAvailable() || legacyFileEditingAvailable();',
          ]
          for marker in checks:
              if marker not in text:
                  raise SystemExit(f'Missing marker: {marker}')
          if 'let ' in text or 'const ' in text or '=>' in text:
              raise SystemExit('IE11-incompatible JavaScript syntax introduced')
      - name: Check JavaScript syntax
        run: node --check js/app.js
      - name: Commit app.js and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ie11-local-csv-app-once.yml
          git add js/app.js
          git commit -m "IEモードでローカルCSV編集と保存に対応"
          git push origin HEAD:main
